# Nord in an airline layout
# Palette: https://www.nordtheme.com/docs/colors-and-palettes
# Pair with `wsx config set theme nord` so the rest of the UI matches.
#
# Airline layout: a bright "mode" block at each outer edge (sections a / z),
# a mid block beside it (b / y), and a base-toned block toward the middle
# (c / x). Left chains point right; right chains point left.
#
# Install:  cp docs/examples/theme-nord.toml ~/.config/wsx/theme.toml
#           wsx config set bar_theme on
#           wsx theme check
# Needs a Nerd Font (for the U+E0B0 / U+E0B2 caps) and a truecolor terminal.
# Reload is live: save the file and the bars update within a second.

[palette]
nord0    = "#2e3440"
nord1    = "#3b4252"
nord2    = "#434c5e"
nord3    = "#4c566a"
nord4    = "#d8dee9"
nord5    = "#e5e9f0"
nord6    = "#eceff4"
nord7    = "#8fbcbb"
nord8    = "#88c0d0"
nord9    = "#81a1c1"
nord10   = "#5e81ac"
nord11   = "#bf616a"
nord12   = "#d08770"
nord13   = "#ebcb8b"
nord14   = "#a3be8c"
nord15   = "#b48ead"

# The wordmark keeps the app's branding (the bundled default: brand-blue
# bar and "x", cream name, dimmed view) flat on the bar background, so
# the header's left edge is the app rather than a mode block; the chain
# starts at the group block, which opens with a left cap.
[dashboard_header]
format       = "$brand [](fg:nord2)[ $group ](bg:nord2 fg:nord4)[](fg:nord2 bg:nord1)[( $sort )](bg:nord1 fg:nord4)[](fg:nord1)(  $filter)"
right_format = "[](fg:nord2)[ $counts ](bg:nord2 fg:nord4)"
fill         = " "

[dashboard_footer]
format       = "[ $keys ](bg:nord8 fg:nord1)[](fg:nord8)"
right_format = "[](fg:nord2)[( $version )](bg:nord2 fg:nord4)([](fg:nord10 bg:nord2)[ $funnel ](bg:nord10 fg:nord6))"
fill         = " "

[attached_top]
format       = "[($agent_bar )$workspace ](bg:nord8 fg:nord1 bold)[](fg:nord8 bg:nord2)[( $attention )](bg:nord2 fg:nord4)[](fg:nord2)"
fill         = " "

[attached_bottom]
format       = "[ $keys ](bg:nord8 fg:nord1)[](fg:nord8 bg:nord2)[( $pins )( $tags )](bg:nord2 fg:nord4)[](fg:nord2)"
right_format = "[](fg:nord1)[( $agents )( $model_tokens )](bg:nord1 fg:nord4)[](fg:nord2 bg:nord1)[( $procs )( $diff )](bg:nord2 fg:nord4)[](fg:nord10 bg:nord2)[( $pr )](bg:nord10 fg:nord6)"
fill         = " "

# --- segments (unset fields keep the bundled defaults) -------------------

[group]
format = "[$label ]()$tabs"

[sort]
format = "[$label ]()$tabs"

[filter]
format = "[/$needle](fg:nord13 bold)"

[counts]
format = "[$repos repos · $workspaces workspaces]()"

# Inherit the block's text colour; the bundled formats use fg:path, which
# would override the block on a coloured background.
[version]
format = "[$version]()"

# The funnel module on the aurora accents; the block's bg (nord10, frost)
# comes from the bar format, so items set only fg.
[module.funnel]
format   = "([$working working](fg:nord14)  )([$blocked blocked](fg:nord11)  )([$review_required review](fg:nord13)  )([$changes_requested changes](fg:nord12)  )([$mergeable ready](fg:nord15))"
priority = 60

[keys]
format    = "[$key](fg:nord0 bold) [$label]()"
separator = "  "

[pins]
format    = "[$index](fg:nord13 bold) [$label]()"
separator = "  "

# The three most-used prompt tags as chips, then the manager chip.
[tags]
format      = "[<$label>]()"
separator   = "  "
more_format = "[ <> ](fg:nord13 bold)"
priority    = 40

# Agent identity in the agent's colour: each harness's Nerd Font icon,
# falling back to a right-pointing chevron for a kind without one (the
# bundled default is a thin vertical bar for every kind).
[agent_bar]
symbol = ""

[agent_bar.symbols]
claude = ""
codex  = ""
omp    = ""
pi     = ""
hermes = ""

# The tokens module names each harness by the glyph above instead of the
# bundled preset's word. Defined but not placed, like the preset: add
# `$tokens` to a bar to show it.
[module.tokens]
format = "([$icon_claude $tokens_claude](fg:agent_claude))(  [$icon_codex $tokens_codex](fg:agent_codex))(  [$icon_omp $tokens_omp](fg:agent_omp))(  [$icon_pi $tokens_pi](fg:agent_pi))"

[workspace]
# Inherit the block's text colour (bold) instead of the base theme's header
# colour, which the engine would otherwise supply as $style.
format = "[($repo/)$name](bold)"

[agents]
format    = "[$symbol($icon )]($style)$label ([$key](fg:nord13 bold))"
separator = "   "

[model_tokens]
format = "([$model](fg:nord7) )[$tokens]($style)"

[diff]
format = "[+$added](fg:nord14 bold) [−$removed](fg:nord11)"

[pr]
format = "[$symbol #$number $label](bold)( [$mark]($mark_style))"
