# Orange in an airline layout, converted from a vim-airline theme
# (~/dotfiles/orange.vim: "originally based on Jellybeans, modified to
# resemble the orclord colorscheme").
# Pair with `wsx config set theme jellybeans` so the rest of the UI matches;
# the greys here come from the same jellybeans-derived palette.
#
# The airline file carries GUI and cterm colours side by side and they
# disagree: the GUI columns still hold the jellybeans greens and greys, the
# cterm columns are the orange ones vim actually renders (no termguicolors).
# The orange is cterm 166 -> #d75f00 and the edge-block text is black; the
# rest of each chain steps away from the orange down an even ramp of xterm
# greys, one shade per block, trending darker toward the middle: smoke
# (cterm 237), soot (236), charcoal (235), ash (234). Left chains run
# orange -> smoke -> soot (-> charcoal on the header); the right chain of
# the attached bottom bar shows the whole ramp, orange at the edge.
#
# Airline layout: a "mode" block at each outer edge (sections a / z), a
# mid block beside it (b / y), and a base-toned block toward the middle
# (c / x). Left chains point right; right chains point left.
# Exception: the attached bottom bar starts with the dark agent-block tone.
#
# Install:  cp docs/examples/theme-orange.toml ~/.config/wsx/theme.toml
#           wsx config set bar_theme on
#           wsx theme check
# Needs a Nerd Font (for the U+E0B0 / U+E0B2 caps) and a truecolor terminal.
# Reload is live: save the file and the bars update within a second.

[palette]
black    = "#151515"   # ctermBlack, as the jellybeans base background
orange   = "#d75f00"   # ctermOrange 166
ash      = "#1c1c1c"   # ctermAsh 234
charcoal = "#262626"   # gui01 (cterm 235)
soot     = "#303030"   # cterm 236, one step above charcoal
smoke    = "#3a3a3a"   # cterm 237, one step above soot
cream    = "#ffd7af"   # ctermBrightYellow 223
green    = "#008700"   # cterm0B 28
blood    = "#870000"   # ctermBlood 88
mint     = "#d7ffaf"   # cterm 193, PR open on orange
lilac    = "#d7afff"   # cterm 189, PR merged
rose     = "#ffd7d7"   # cterm 224, PR closed
butter   = "#ffffaf"   # cterm 229, PR conflicted
chalk    = "#eeeeee"   # cterm 255, PR draft

# The wordmark keeps the app's branding (brand-blue bar and "x", cream
# name) flat on the bar background, so the header's left edge is the app
# rather than an orange mode block; the brand segment then caps its own
# view block on smoke, and the chain steps on to group on soot and sort on
# charcoal. The counts segment splits the same way on the right.
[dashboard_header]
format       = "$brand[](fg:smoke bg:soot)[ $group ](bg:soot fg:orange)[](fg:soot bg:charcoal)[( $sort )](bg:charcoal fg:cream)[](fg:charcoal)(  $filter)"
right_format = "[](fg:smoke)[$counts ](bg:orange fg:black)"
fill         = " "

# Left: a blank orange stub as the mode block, then the key hints on smoke,
# so the footer chain reads like the header's brand -> view step.
[dashboard_footer]
format       = "[  ](bg:orange)[](fg:orange bg:smoke)[ $keys ](bg:smoke fg:orange)[](fg:smoke)"
right_format = "([](fg:orange)[ $funnel ](bg:orange fg:black))"
fill         = " "

# The focused agent's glyph leads on its own ash block, in the agent's
# colour, wedging into the orange workspace block; with no agent the group
# drops and the workspace block takes the edge. The attention entries are
# graded blocks (see [attention]). The orange block keeps one cell of
# spacer and caps straight onto the first entry, whose grade is ash; each
# block after that — entry or fold tail — draws its own trailing wedge,
# the last one into the bar. With nothing to show, the chain collapses to
# the orange wedge like the other bars' blocks.
[attached_top]
format       = "([ $agent_bar ](bg:ash)[\ue0b0](fg:ash bg:orange))[ $workspace  ](bg:orange fg:black bold)[\ue0b0](fg:orange bg:ash)$attention"
fill         = " "

# Left: key hints on ash, matching the top bar's agent block, then pinned
# commands on soot and tags on charcoal. Right chain, orange at the edge
# then the greys darkening toward the middle: pr on orange, diff on smoke, procs on soot,
# model + tokens on charcoal, agents on ash. Optional segments get their
# own block so every step shows; a missing one collapses to its wedge.
[attached_bottom]
format       = "[ $keys ](bg:ash fg:orange)[](fg:ash bg:soot)[( $pins )](bg:soot fg:orange)[](fg:soot bg:charcoal)[( $tags )](bg:charcoal fg:orange)[](fg:charcoal)"
right_format = "[](fg:ash)[( $agents )](bg:ash fg:cream)[](fg:charcoal bg:ash)[( $model_tokens )](bg:charcoal fg:cream)[](fg:soot bg:charcoal)[( $procs )](bg:soot fg:orange)[](fg:smoke bg:soot)[( $diff )](bg:smoke fg:orange)[](fg:orange bg:smoke)[( $pr )](bg:orange fg:black)"
fill         = " "

# --- segments (unset fields keep the bundled defaults) -------------------

# Brand colours are theme tokens (`brand`, `wordmark`), same as the bundled
# default. The view block opens with a left cap since there is no block
# before it to wedge out of.
[brand]
format = "[$symbol](fg:brand) [$name](fg:wordmark bold)[ $mark](fg:brand bold) [](fg:smoke)[ $view ](bg:smoke fg:orange)"

[group]
format = "[$label ]()$tabs"

[sort]
format = "[$label ]()$tabs"

[filter]
format = "[/$needle](fg:orange bold)"

# Two blocks, like the brand: repos on smoke toward the middle, workspaces
# on orange at the edge.
[counts]
format = "[ $repos repos ](bg:smoke fg:orange)[](fg:orange bg:smoke)[ $workspaces workspaces]()"

# Inherit the block's text colour; the bundled formats use fg:path, which
# would override the block on a coloured background.
[version]
format = "[$version]()"

# The funnel module on the orange palette; the block's bg (orange) comes
# from the bar format, so items set only fg. The local palette has no
# yellow or purple, so review and ready borrow the jellybeans-derived
# theme tokens (waiting, merged) this theme pairs with.
[module.funnel]
format   = "([$working working](fg:green)  )([$blocked blocked](fg:blood)  )([$review_required review](fg:waiting)  )([$changes_requested changes](fg:cream)  )([$mergeable ready](fg:merged))"
priority = 60

[keys]
format    = "[$key](fg:cream bold) [$label]()"
separator = "  "

[pins]
format    = "[$index](fg:cream bold) [$label]()"
separator = "  "

# The three most-used prompt tags as chips, then the manager chip.
[tags]
format      = "[<$label>]()"
separator   = "  "
more_format = "[ <> ](fg:cream bold)"
priority    = 40

# Agent identity in the agent's colour: each harness's Nerd Font icon,
# falling back to a right-pointing chevron for a kind without one (the
# bundled default is a thin vertical bar for every kind).
[agent_bar]
symbol = ""

[agent_bar.symbols]
claude = ""
codex  = ""
omp    = ""
pi     = ""
hermes = ""

# The tokens module names each harness by the glyph above instead of the
# bundled preset's word. Defined but not placed, like the preset: add
# `$tokens` to a bar to show it.
[module.tokens]
format = "([$icon_claude $tokens_claude](fg:agent_claude))(  [$icon_codex $tokens_codex](fg:agent_codex))(  [$icon_omp $tokens_omp](fg:agent_omp))(  [$icon_pi $tokens_pi](fg:agent_pi))"

# The name carries the branch's PR-lifecycle tint like the pr block does.
# The base theme's tints are picked for the dark background and wash out
# on orange, and darker ones of the same hue do no better: the orange sits
# at mid luminance, so a green dark enough to read is a hair from black
# (forest 22 is 2.1:1 against it, olive 100 is invisible at 1.0:1). Pale
# tints from the same xterm cube keep the hue and clear 3:1 instead: mint
# 193, lilac 189, rose 224, butter 229. The diff block keeps green 28,
# which reads fine on smoke. Without a PR, and on a draft, the tint falls
# back to header_fg, shadowed here to chalk so it reads as greyed out
# against the block's black text.
[workspace]
format = "[($repo/)$name]($style bold)"

[workspace.palette]
ok        = "mint"
merged    = "lilac"
err       = "rose"
warn      = "butter"
header_fg = "chalk"

# Attention entries as graded airline blocks: the first on ash, every one
# after on black, the base background (styles clamp to the last grade),
# so the first entry reads as a block and the rest sit flat on the bar.
# Grades set only the background, so each name keeps its PR-lifecycle
# tint; the age is cream, dimmed. Every block draws its own trailing
# wedge from its bg (item_bg) into the next block's (next_bg): the next
# entry's grade, the fold tail's orange (more_style) when one follows, or
# nothing — the bar — after the last. The tail is an orange block that
# caps itself the same way. Literal parens around the age must be
# escaped: bare ( ) is the conditional group.
[attention]
styles      = ["bg:ash", "bg:black"]
more_style  = "bg:orange fg:black"
format      = "[[ $glyph $repo/$name ]($style)[\\($age\\) ](fg:cream dimmed)](bg:item_bg)[\ue0b0](fg:item_bg bg:next_bg)"
separator   = ""
more_format = "[ +$count more ]($style bold)[\ue0b0](fg:item_bg)"

[agents]
format    = "[$symbol($icon )]($style)$label ([$key](bold))"
separator = "   "

[model_tokens]
format = "([$model](bold) )[$tokens]($style)"

[diff]
format = "[+$added](fg:green bold) [−$removed](fg:#ff8080)"

# Keep the lifecycle tint ($style: mint open, lilac merged, rose closed)
# on top of the block's orange, instead of the block's black text — the
# same pale variants as the workspace block, since both sit on orange.
# A draft PR has no tint and falls back to dim, shadowed to chalk here.
[pr]
format = "[$symbol #$number $label]($style bold)( [$mark]($mark_style))"

[pr.palette]
ok     = "mint"
merged = "lilac"
err    = "rose"
warn   = "butter"
dim    = "chalk"
