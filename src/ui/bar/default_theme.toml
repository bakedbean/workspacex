# wsx bar theme — the bundled default. `wsx theme init` copies this to
# ~/.config/wsx/theme.toml; edit it there and wsx reloads it while running.
# Anything you leave out keeps the value below.
#
# Grammar (a subset of starship's):
#   $name / ${name}   insert a segment (in a [segment] table: a variable)
#   [text](style)     style a run; nested runs inherit the outer bg
#   ( ... )           render only if a $segment inside is non-empty
#   $$  \[  \(        literal characters
#   style tokens      fg:<c> bg:<c> <c> bold dimmed italic underline none $style
#   colors            #rrggbb, 0-255, ansi names (red, bright-blue, white),
#                     [palette] names, theme tokens: dim path code bg_alt bg_soft
#                     ok warn err attention merged header_fg selected_fg
#                     selected_bg question stalled waiting thinking complete
#                     idle brand wordmark
#
# Bars take `format`, `right_format` (flush right), `style`, `fill`,
# `fill_style`. When a bar is too narrow, segments given a `priority` below
# the default 100 drop — lowest first, from either side — until it fits;
# segments at the default never drop, so the left side is clipped and the
# right omitted if nothing droppable is left. Segments take `format`,
# `style` (merged over the segment's own state color, available as $style),
# `symbol`, `disabled`, `priority`, and `separator` (between items of
# keys/pins/agents).
#
# The evaluator always keeps one blank cell between a nonempty `format` and
# a nonempty `right_format`, so `right_format` groups need only one leading
# space of their own padding, not two.

[palette]

[dashboard_footer]
format = "$keys"
# The leading "  " gap is grouped with $funnel so it drops along with it (not
# left as an orphaned gap) when the funnel is empty or the terminal is too
# narrow for both.
right_format = "$version(  $funnel)"
fill = " "

# The dashboard's top line: wordmark, group and sort tabs, the live filter
# echo, and the repo/workspace counts flush right.
[dashboard_header]
format       = "$brand      $group(   $sort)(  $filter)"
right_format = "$counts"
fill         = " "

[attached_top]
format = "($agent_bar )$workspace(   $attention)"

[attached_bottom]
format       = "$keys  ($pins  )($tags  )"
# Each element carries its OWN trailing separator, so a missing element
# takes its gap with it (a single-agent workspace, with no agent pills,
# still gets exactly one gap before model_tokens, not two). The one
# leading space here plus the engine's mandatory blank reproduce the
# stock two-cell gap after the rule. The tradeoff: a workspace with no PR
# — $pr is bare, with no trailing separator of its own — leaves one blank
# cell at the right edge instead of hugging it exactly; accepted.
right_format = "( ($agents   )($model_tokens )($procs )($diff )$pr)"
fill         = "─"
fill_style   = "fg:dim"

# The dashboard detail pane's pinned-command row: chips, then a rule to
# the edge. Only `$pins` carries data here; other segments render empty.
[dashboard_detail]
format     = "($pins  )"
fill       = "─"
fill_style = "fg:dim"

# --- segments ---------------------------------------------------------

# The wordmark on the dashboard's top line. Variables: $symbol $name $mark $view
[brand]
symbol = "▌"
format = "[$symbol](fg:brand) [$name](fg:wordmark bold)[ $mark](fg:brand bold)[ · $view](fg:dim)"

# Variables: $label $tabs (the active tab is highlighted)
[group]
format = "[$label ](fg:path)$tabs"

# Variables: $label $tabs (the active tab is highlighted)
[sort]
format   = "[$label ](fg:path)$tabs"
# First to go on a narrow header: the order stays discoverable from `o` and
# the footer hint, whereas the counts have no other home on that line.
priority = 30

# The live filter echo. Variables: $needle (absent when no filter is active)
# Never dropped, only truncated: a needle with no visible cause is worse
# than a shortened one, since rows are missing and nothing says why.
[filter]
format = "[/$needle]($style)"

# Variables: $repos $workspaces
[counts]
format   = "[$repos repos · $workspaces workspaces](fg:path)"
priority = 50

# Key hints: one pill per binding. Variables: $key $label
[keys]
format    = "[ $key ](bg:bg_soft fg:dim bold)[ $label](fg:path)"
separator = "  "

# Variables: $version
[version]
format   = "[$version](fg:path)"
# Least useful right-side element on the dashboard footer, so it drops
# before the funnel module when the terminal is too narrow for both.
priority = 50

# Usage sparkline. Variables: $label $spark
# Not placed by default any more — put `$usage` in a bar format to bring it
# back (it keeps its click, which opens the window picker).
[usage]
format = "[$label $spark](fg:path)"
priority = 60

# Agent identity bar; $style carries the agent's color. Variables: $symbol
# An `[agent_bar.symbols]` table (keys: claude, pi, hermes, codex, omp)
# gives a kind its own glyph; `symbol` covers the kinds without one.
[agent_bar]
symbol = "▎"
format = "[$symbol]($style)"

# Focused workspace. Variables: $repo $name
[workspace]
format = "[($repo/)$name]($style)"

# Cross-workspace attention entries: one item per workspace, folded into
# `more_format` when they don't fit. $glyph carries the entry's status
# color; $style is the name's PR-lifecycle tint (or the muted path hue).
# Variables: $glyph $repo $name $age — and $count in more_format
[attention]
format      = '$glyph [$repo/$name]($style)[ \($age\)](fg:dim)'
separator   = "[ │ ](fg:dim)"
more_format = "[ … +$count more](fg:dim)"

# Pinned commands: one chip per command. Variables: $index $label
[pins]
format    = "[ $index ](bg:bg_soft fg:dim bold)[ $label](fg:path)"
separator = "  "

# Prompt tags: the three most-used tags as chips, then the manager chip
# (`more_format`; its `$count` is how many tags are saved). Clicking a chip
# opens the body box for that tag; the manager chip opens the picker
# (`^x <`). Variables: $index $label
[tags]
format      = "[<$label>](fg:path)"
separator   = "  "
more_format = "[ <> ](bg:bg_soft fg:dim bold)"
# 40 ties [diff]'s priority below. On a tie the engine drops the left-side
# segment first, so these chips yield before the diff count -- bar/tests.rs'
# narrow-row test depends on this ordering.
priority    = 40

# Agent pills (2+ agents). $style is the agent color. Variables: $symbol
# $icon $label $key — $icon is the kind's [agent_bar.symbols] glyph, absent
# (its group collapsing) for a kind without one.
[agents]
format    = "[$symbol($icon )]($style)$label ([ $key ](bg:bg_soft fg:dim bold))"
separator = "   "
priority  = 20

# Variables: $model $tokens ($style is ok, or warn near the limit)
[model_tokens]
format   = "([$model](fg:code) )[$tokens]($style)"
priority = 10

# Running processes. Variables: $symbol $count
[procs]
symbol   = "●"
format   = "[$symbol ${count}p]($style)"
priority = 30

# Variables: $added $removed
[diff]
format   = "[+$added](fg:ok) [−$removed](fg:err)"
priority = 40

# PR chip; $style is the lifecycle color, $mark_style the review verdict.
# Variables: $symbol $number $label $mark
[pr]
format   = "[$symbol #$number $label]($style)( [$mark]($mark_style))"
priority = 50

# --- modules ----------------------------------------------------------
# A [module.<name>] table is a segment you compose yourself from fleet-wide
# variables and place in any bar as $<name>. It takes `format`, `style`,
# `priority`, `disabled` only. Counts render empty at zero, so wrap each item
# in ( ) to drop it; `$workspaces` and `$repos` always render. The $tokens*
# variables are context-size sums, abbreviated (77k, 1.2M), empty at zero.
# The $icon_* variables are each kind's [agent_bar.symbols] glyph, absent
# for a kind without one. An icon is a label: it renders beside a count but,
# like literal text, never keeps a ( ) group alive by itself, so
# `([$icon_pi $tokens_pi])` drops with the count exactly as `[pi $tokens_pi]`.
#
# Variables: $working $waiting $blocked $done $busy $unreported $alerts
#   $awaiting $stalled $active $idle $live_agents $pr_none $pr_draft
#   $pr_open $pr_conflicted $pr_merged $pr_closed $review_required
#   $changes_requested $approved $unresolved $mergeable $dirty $msgs_queued
#   $workspaces $repos $tokens_total $tokens_claude $tokens_pi $tokens_hermes
#   $tokens_codex $tokens_omp $icon_claude $icon_pi $icon_hermes $icon_codex
#   $icon_omp

# The delivery funnel: how many workspaces sit at each stage of the
# pipeline, from working through review to mergeable. Each item carries
# its own trailing gap so a missing stage takes its gap with it; the last
# has none so the module hugs the right edge.
[module.funnel]
format   = "([$working working](fg:ok)  )([$blocked blocked](fg:err)  )([$review_required review](fg:waiting)  )([$changes_requested changes](fg:warn)  )([$mergeable ready](fg:merged))"
# Same slot as $usage had: $version drops first on a narrow footer.
priority = 60

# Context fill by agent kind: how many prompt-side tokens each harness has
# loaded across the fleet right now (not cumulative spend). Defined but not
# placed — add `$tokens` to a bar to show it, e.g.
#   right_format = "$version(  $tokens)(  $funnel)"
# Gaps lead each item after the first (the opposite of the funnel) so the
# module hugs the right edge whichever trailing kinds are absent; kinds are
# ordered most- to least-common so the leading one is rarely the gap. Each
# label wears its agent's identity colour via the `agent_<kind>` tokens.
# The bundled [agent_bar.symbols] is empty, so the labels are words; a
# theme that draws each harness's glyph there can swap in `$icon_<kind>`,
# as the example themes do.
[module.tokens]
format   = "([claude $tokens_claude](fg:agent_claude))(  [codex $tokens_codex](fg:agent_codex))(  [omp $tokens_omp](fg:agent_omp))(  [pi $tokens_pi](fg:agent_pi))"
# Between $version (50) and $funnel (60): the first of the two modules to
# drop when the footer is narrow.
priority = 55
