# Rosé Pine Moon in an airline layout (the softer, slightly lighter dark variant)
# Palette: https://rosepinetheme.com/palette
# No built-in base palette matches; the default `wsx config set theme wsx` works.
#
# Airline layout: a bright "mode" block at each outer edge (sections a / z),
# a mid block beside it (b / y), and a base-toned block toward the middle
# (c / x). Left chains point right; right chains point left.
#
# Install:  cp docs/examples/theme-rose-pine-moon.toml ~/.config/wsx/theme.toml
#           wsx config set bar_theme on
#           wsx theme check
# Needs a Nerd Font (for the U+E0B0 / U+E0B2 caps) and a truecolor terminal.
# Reload is live: save the file and the bars update within a second.

[palette]
base     = "#232136"
surface  = "#2a273f"
overlay  = "#393552"
muted    = "#6e6a86"
subtle   = "#908caa"
text     = "#e0def4"
love     = "#eb6f92"
gold     = "#f6c177"
rose     = "#ea9a97"
pine     = "#3e8fb0"
foam     = "#9ccfd8"
iris     = "#c4a7e7"
hl_med   = "#44415a"
hl_high  = "#56526e"

# The wordmark keeps the app's branding (the bundled default: brand-blue
# bar and "x", cream name, dimmed view) flat on the bar background, so
# the header's left edge is the app rather than a mode block; the chain
# starts at the group block, which opens with a left cap.
[dashboard_header]
format       = "$brand [](fg:hl_med)[ $group ](bg:hl_med fg:text)[](fg:hl_med bg:surface)[( $sort )](bg:surface fg:subtle)[](fg:surface)(  $filter)"
right_format = "[](fg:hl_high)[ $counts ](bg:hl_high fg:text)"
fill         = " "

[dashboard_footer]
format       = "[ $keys ](bg:rose fg:base)[](fg:rose)"
right_format = "[](fg:hl_high)[( $version )](bg:hl_high fg:text)([](fg:pine bg:hl_high)[ $funnel ](bg:pine fg:text))"
fill         = " "

# The focused agent's glyph leads on its own hl_med block, in the agent's
# colour, wedging into the rose workspace block; with no agent the group
# drops and the workspace block takes the edge.
[attached_top]
format       = "([ $agent_bar ](bg:hl_med)[](fg:hl_med bg:rose))[ $workspace ](bg:rose fg:base bold)[](fg:rose bg:hl_med)[( $attention )](bg:hl_med fg:text)[](fg:hl_med)"
fill         = " "

[attached_bottom]
format       = "[ $keys ](bg:rose fg:base)[](fg:rose bg:hl_med)[( $pins )( $tags )](bg:hl_med fg:text)[](fg:hl_med)"
right_format = "[](fg:surface)[( $agents )( $model_tokens )](bg:surface fg:subtle)[](fg:hl_high bg:surface)[( $procs )( $diff )](bg:hl_high fg:text)[](fg:pine bg:hl_high)[( $pr )](bg:pine fg:text)"
fill         = " "

# --- segments (unset fields keep the bundled defaults) -------------------

[group]
format = "[$label ]()$tabs"

[sort]
format = "[$label ]()$tabs"

[filter]
format = "[/$needle](fg:gold bold)"

[counts]
format = "[$repos repos · $workspaces workspaces]()"

# Inherit the block's text colour; the bundled formats use fg:path, which
# would override the block on a coloured background.
[version]
format = "[$version]()"

# The funnel module on the rosé pine moon palette; the block's bg (pine)
# comes from the bar format, so items set only fg. foam/love echo the diff
# segment's positive/negative pairing below.
[module.funnel]
format   = "([$working working](fg:foam)  )([$blocked blocked](fg:love)  )([$review_required review](fg:gold)  )([$changes_requested changes](fg:rose)  )([$mergeable ready](fg:iris))"
priority = 60

[keys]
format    = "[$key](fg:base bold) [$label]()"
separator = "  "

[pins]
format    = "[$index](fg:gold bold) [$label]()"
separator = "  "

# The three most-used prompt tags as chips, then the manager chip.
[tags]
format      = "[<$label>]()"
separator   = "  "
more_format = "[ <> ](fg:gold bold)"
priority    = 40

# Agent identity in the agent's colour: each harness's Nerd Font icon,
# falling back to a right-pointing chevron for a kind without one (the
# bundled default is a thin vertical bar for every kind).
[agent_bar]
symbol = ""

[agent_bar.symbols]
claude = ""
codex  = ""
omp    = ""
pi     = ""
hermes = ""

# The tokens module names each harness by the glyph above instead of the
# bundled preset's word. Defined but not placed, like the preset: add
# `$tokens` to a bar to show it.
[module.tokens]
format = "([$icon_claude $tokens_claude](fg:agent_claude))(  [$icon_codex $tokens_codex](fg:agent_codex))(  [$icon_omp $tokens_omp](fg:agent_omp))(  [$icon_pi $tokens_pi](fg:agent_pi))"

[workspace]
# Inherit the block's text colour (bold) instead of the base theme's header
# colour, which the engine would otherwise supply as $style.
format = "[($repo/)$name](bold)"

[agents]
format    = "[$symbol($icon )]($style)$label ([$key](fg:gold bold))"
separator = "   "

[model_tokens]
format = "([$model](fg:foam) )[$tokens]($style)"

[diff]
format = "[+$added](fg:foam bold) [−$removed](fg:love)"

[pr]
format = "[$symbol #$number $label](bold)( [$mark]($mark_style))"
