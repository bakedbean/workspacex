[book]
title = "wsx (WorkspaceX)"
authors = ["Eben Goodman"]
description = "Terminal UI for managing Claude Code, Pi, Hermes, Codex, or oh-my-pi sessions in git worktrees."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/bakedbean/workspacex"
edit-url-template = "https://github.com/bakedbean/workspacex/edit/main/docs/book/{path}"
site-url = "/docs/"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-js = ["theme/cf-analytics.js"]

[output.html.search]
enable = true

# Old page paths, kept working after the docs restructure.
